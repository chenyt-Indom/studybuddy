# StudyBuddy 反向代理配置
#
# 用法：
#   sudo cp deploy/nginx-studybuddy.conf /etc/nginx/sites-available/studybuddy
#   sudo ln -s /etc/nginx/sites-available/studybuddy /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 把 study.example.com 换成你自己的域名（没有域名就写服务器公网 IP）
#
# 注意：/static 不要单独再包一层缓存规则。前端资源已经由后端带 ?v=mtime 版本号 +
# Cache-Control: no-cache，再叠一层 nginx 缓存规则只会把「改了没生效」这个坑请回来。

server {
    listen 80;
    listen [::]:80;
    server_name study.example.com;

    # ⚠️ 图片上传是 8MB 上限，nginx 默认只给 1MB，不改会直接 413
    client_max_body_size 12m;

    # 大 PDF 导入教材时解析要十几秒，别让网关先超时
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- 流式对话（SSE）的关键四行 ----
        # 不关缓冲：思维链和正文会「憋到最后一次性吐出来」，看起来像卡死
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # 讲长题可能几十秒没有新数据，读超时别设太短
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
